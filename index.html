<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Planner</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0f0f10;color:#e8e6e0;font-family:'DM Sans','Segoe UI',sans-serif}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#2a2a2e;border-radius:4px}
input,button,textarea,select{font-family:inherit}button{cursor:pointer}
/* TOPBAR */
.topbar{display:flex;align-items:center;padding:0 20px;height:52px;border-bottom:1px solid #1a1a1e;background:#0f0f10;position:sticky;top:0;z-index:90;flex-shrink:0}
.star-btn{width:34px;height:34px;border-radius:8px;border:none;background:transparent;color:#e8e3d8;font-size:18px;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
.star-btn:hover{background:#1a1a1e}
.page-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:#e8e3d8;margin-left:10px;letter-spacing:-.01em}
.topbar-right{margin-left:auto}
.sout{font-size:12px;color:#333;background:none;border:none;transition:color .15s}.sout:hover{color:#888}
/* SIDEBAR */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.open{opacity:1;pointer-events:all}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;background:#111118;border-right:1px solid #1e1e28;z-index:201;transform:translateX(-100%);transition:transform .22s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;padding:0}
.sidebar.open{transform:none}
.sidebar-head{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid #1a1a1e}
.sidebar-logo{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;color:#e8e3d8;letter-spacing:.06em}
.sidebar-close{margin-left:auto;background:none;border:none;color:#444;font-size:20px;line-height:1;transition:color .15s}.sidebar-close:hover{color:#aaa}
.sidebar-nav{flex:1;overflow-y:auto;padding:10px 0}
.snav-item{display:flex;align-items:center;gap:12px;padding:12px 18px;color:#555;font-size:14px;font-weight:500;transition:all .15s;border:none;background:none;width:100%;text-align:left;border-left:2px solid transparent}
.snav-item:hover{color:#ccc;background:#1a1a1e}
.snav-item.active{color:#e8e3d8;background:#1a1a1e;border-left-color:#e8e3d8}
.snav-icon{font-size:16px;width:20px;text-align:center}
/* MAIN */
.shell{display:flex;flex-direction:column;height:100vh}
.scroll{flex:1;overflow-y:auto}
.wrap{max-width:780px;margin:0 auto;padding:20px 20px 90px}
/* AUTH */
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 20px}
.acard{background:#15151a;border:1px solid #1e1e24;border-radius:18px;padding:38px;max-width:400px;width:100%}
.alogo{font-family:'Syne',sans-serif;font-size:12px;font-weight:800;color:#333;letter-spacing:.14em;text-transform:uppercase;margin-bottom:22px}
.atitle{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:#e8e3d8;margin-bottom:5px}
.asub{font-size:13px;color:#555;line-height:1.6;margin-bottom:22px}
.alabel{font-size:11px;color:#555;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px;font-weight:500}
.ainput{width:100%;background:#1a1a1e;border:1px solid #2a2a2e;border-radius:10px;padding:12px 14px;color:#e8e6e0;font-size:14px;outline:none;margin-bottom:12px;transition:border-color .15s}
.ainput:focus{border-color:#555}.ainput::placeholder{color:#3a3a40}
.abtn{width:100%;background:#e8e3d8;color:#0f0f10;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:600;transition:all .15s}
.abtn:hover{background:#f0ece3}.abtn:disabled{opacity:.5;cursor:not-allowed}
.atoggle{width:100%;background:transparent;border:1px solid #2a2a2e;color:#555;border-radius:10px;padding:11px;font-size:13px;transition:all .15s;margin-top:9px}
.atoggle:hover{border-color:#444;color:#999}
.aerr{font-size:13px;color:#9a5a5a;margin-top:8px;text-align:center}
.anote{font-size:11px;color:#3a3a40;margin-top:14px;line-height:1.6;text-align:center}
.anote a{color:#5a7a9a;text-decoration:none}
/* SYNC */
.syncbar{position:fixed;bottom:0;left:0;right:0;background:#0f0f10;border-top:1px solid #1a1a1e;padding:7px 20px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:11px;color:#2e2e34;z-index:80}
.sdot{width:5px;height:5px;border-radius:50%;background:#2e2e34;flex-shrink:0}
.sdot.synced{background:#5a8a5a}.sdot.syncing{background:#a5843a;animation:pulse 1s infinite}.sdot.error{background:#8a4a4a}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes fadeIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* SHARED COMPONENTS */
.page-header{padding:20px 0 6px}
.sectitle{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;color:#e8e3d8;letter-spacing:-.02em}
.secsub{font-size:13px;color:#444;margin-top:3px;margin-bottom:16px}
.divr{height:1px;background:#1a1a1e;margin:20px 0}
.addrow{display:flex;gap:7px;margin-bottom:16px}
.addinput{flex:1;background:#1a1a1e;border:1px solid #2a2a2e;border-radius:10px;padding:10px 13px;color:#e8e6e0;font-size:14px;outline:none;transition:border-color .15s}
.addinput:focus{border-color:#555}.addinput::placeholder{color:#3a3a40}
.addbtn{background:#e8e3d8;color:#0f0f10;border:none;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:500;transition:all .15s;flex-shrink:0}
.addbtn:hover{background:#f0ece3}
.ibtn{background:none;border:none;padding:4px;color:#2e2e34;transition:color .15s;display:flex;align-items:center;flex-shrink:0}
.ibtn:hover{color:#999}
.empty{text-align:center;padding:44px 0}
.eicon{font-size:24px;margin-bottom:8px}.etxt{font-size:14px;color:#2e2e34}
/* TAGS */
.tag-pill{display:inline-flex;align-items:center;gap:4px;border-radius:100px;padding:2px 9px;font-size:11px;font-weight:500;flex-shrink:0}
.tag-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.tag-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.tag-filter{padding:4px 11px;border-radius:100px;border:1px solid #2a2a2e;background:transparent;color:#555;font-size:12px;transition:all .15s;cursor:pointer}
.tag-filter:hover{border-color:#555;color:#ccc}
.tag-filter.active{border-color:currentColor;font-weight:500}
.tag-picker{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tcolor{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .1s}
.tcolor:hover{transform:scale(1.15)}
.tcolor.sel{border-color:#fff;transform:scale(1.1)}
.tag-select{background:#1a1a1e;border:1px solid #2a2a2e;border-radius:8px;padding:6px 10px;color:#c8c5bc;font-size:12px;outline:none;transition:border-color .15s}
.tag-select:focus{border-color:#555}
/* TASKS */
.secnav{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none;align-items:center}
.secnav::-webkit-scrollbar{display:none}
.sbtn{padding:6px 13px;border-radius:100px;border:1px solid #2a2a2e;background:transparent;color:#555;font-size:12px;transition:all .15s;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:4px}
.sbtn:hover{border-color:#444;color:#ccc;background:#1a1a1e}
.sbtn.active{background:#e8e3d8;color:#0f0f10;border-color:#e8e3d8;font-weight:500}
.badge{font-size:10px;font-weight:600;padding:1px 5px;border-radius:100px;background:#2a2a2e;color:#555}
.sbtn.active .badge{background:rgba(0,0,0,.15);color:#0f0f10}
.add-sec-btn{width:26px;height:26px;border-radius:50%;border:1px dashed #2a2a2e;background:transparent;color:#444;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.add-sec-btn:hover{border-color:#666;color:#aaa}
.new-sec-input{background:#1a1a1e;border:1px solid #444;border-radius:100px;padding:5px 11px;color:#e8e6e0;font-size:12px;outline:none;width:110px;flex-shrink:0}
.tasklist{border-top:1px solid #1a1a1e}
.trow{border-bottom:1px solid #1a1a1e;animation:fadeIn .18s ease}
.tmain{display:flex;align-items:center;gap:8px;padding:10px 0}
.cbox{width:18px;height:18px;flex-shrink:0;border:1.5px solid #3a3a40;border-radius:5px;background:transparent;display:flex;align-items:center;justify-content:center;transition:all .15s}
.cbox:hover{border-color:#777}.cbox.done{background:#b5a98c;border-color:#b5a98c}
.twrap{flex:1;min-width:0}
.ttext{font-size:14px;color:#c8c5bc;line-height:1.4;word-break:break-word}
.ttext.done{text-decoration:line-through;color:#444}
.tmeta{display:flex;align-items:center;gap:5px;margin-top:3px;flex-wrap:wrap}
.tdatetag{font-size:10px;color:#555;background:#1a1a1e;border-radius:4px;padding:2px 6px}
.tsubcount{font-size:10px;color:#555}
.edinput{flex:1;background:#1a1a1e;border:1px solid #555;border-radius:6px;padding:6px 10px;color:#e8e6e0;font-size:14px;outline:none}
.done-lbl{font-size:10px;letter-spacing:.1em;color:#2a2a2e;text-transform:uppercase;margin:12px 0 4px;font-weight:500}
.done-row{opacity:.4}
.tdetail{background:#111118;border:1px solid #1a1a26;border-radius:10px;margin:0 0 4px 26px;padding:13px;animation:fadeIn .15s ease}
.dlabel{font-size:10px;color:#3a3a40;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;font-weight:500;margin-top:10px}
.dlabel:first-child{margin-top:0}
.narea{width:100%;background:#1a1a1e;border:1px solid #1e1e28;border-radius:8px;padding:8px 11px;color:#9a9890;font-size:13px;line-height:1.6;outline:none;resize:none;min-height:60px;transition:border-color .15s}
.narea:focus{border-color:#3a3a40}.narea::placeholder{color:#2a2a30}
.dateinput{width:100%;background:#1a1a1e;border:1px solid #1e1e28;border-radius:8px;padding:7px 10px;color:#9a9890;font-size:13px;outline:none;transition:border-color .15s}
.dateinput:focus{border-color:#3a3a40}
.subrow{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid #161620}
.subrow:last-child{border-bottom:none}
.scbox{width:14px;height:14px;flex-shrink:0;border:1.5px solid #2a2a3a;border-radius:3px;background:transparent;display:flex;align-items:center;justify-content:center;transition:all .15s}
.scbox:hover{border-color:#555}.scbox.done{background:#7a6a5a;border-color:#7a6a5a}
.stext{flex:1;font-size:13px;color:#777}.stext.done{text-decoration:line-through;color:#3a3a3a}
.sdel{background:none;border:none;color:#2a2a2e;padding:2px;transition:color .15s;display:flex;align-items:center}.sdel:hover{color:#888}
.sarow{display:flex;gap:6px;margin-top:8px}
.sinput{flex:1;background:#1a1a1e;border:1px solid #1e1e28;border-radius:7px;padding:6px 10px;color:#c0bdb5;font-size:13px;outline:none}
.sinput::placeholder{color:#2a2a2e}
.sabtn{background:#1e1e28;border:none;color:#777;border-radius:7px;padding:6px 11px;font-size:12px;transition:all .15s}
.sabtn:hover{background:#2a2a38;color:#ccc}
/* SHOPPING */
.shoprow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #1a1a1e;animation:fadeIn .18s ease}
.shoprow:last-child{border-bottom:none}
.gcheck{width:18px;height:18px;flex-shrink:0;border:1.5px solid #3a8a5a;border-radius:5px;background:transparent;display:flex;align-items:center;justify-content:center;transition:all .15s}
.gcheck:hover{border-color:#6aca8a}.gcheck.done{background:#4a7a5a;border-color:#4a7a5a}
.shopwrap{flex:1;min-width:0}
.shoptext{font-size:14px;color:#c8c5bc}.shoptext.done{text-decoration:line-through;color:#444}
.shopqty{font-size:11px;color:#555;background:#1a1a1e;border-radius:4px;padding:2px 6px;flex-shrink:0}
.shopdetail{background:#111118;border:1px solid #1a1a26;border-radius:10px;margin:0 0 4px 26px;padding:13px;animation:fadeIn .15s ease}
.gclear-btn{background:transparent;border:1px solid #2a2a2e;color:#555;border-radius:8px;padding:7px 13px;font-size:12px;transition:all .15s}
.gclear-btn:hover{border-color:#9a4a4a;color:#9a5a5a}
.shop-addrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.sminput{background:#1a1a1e;border:1px solid #2a2a2e;border-radius:9px;padding:9px 12px;color:#e8e6e0;font-size:13px;outline:none;transition:border-color .15s}
.sminput:focus{border-color:#555}.sminput::placeholder{color:#3a3a40}
/* HABITS */
.htop{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.ptrack{height:3px;background:#1e1e22;border-radius:2px;overflow:hidden;margin-top:5px;width:60px}
.pfill{height:100%;background:#5a8a5a;border-radius:2px;transition:width .4s ease}
.hcard{background:#13131a;border:1px solid #1e1e24;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;margin-bottom:7px;animation:fadeIn .18s ease}
.hcard.ht{border-color:#243024;background:#101a10}
.htoprow{display:flex;align-items:center;gap:9px}
.htoggle{width:22px;height:22px;border-radius:50%;border:1.5px solid #3a3a40;background:transparent;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.htoggle.done{background:#5a8a5a;border-color:#5a8a5a}
.hname{flex:1;font-size:14px;color:#888;font-weight:500;transition:color .2s}.hname.done{color:#7ab87a}
.hstreak{display:flex;align-items:center;gap:3px;background:#162016;border-radius:100px;padding:2px 8px}
.hstreakn{font-size:12px;font-weight:600;color:#6aaa6a}
.hdots{display:flex;align-items:center;gap:5px}
.dcol{display:flex;flex-direction:column;align-items:center;gap:3px}
.dot{width:8px;height:8px;border-radius:50%;border:1px solid #1e1e28;background:transparent;transition:background .15s}
.dot.hit{background:#5a8a5a;border-color:#5a8a5a}.dot.td{border:1.5px solid #555}
.dlbl{font-size:8px;color:#2e2e2e}
.best{margin-left:auto;font-size:10px;color:#252525}.best span{color:#4a6a3a}
/* NOTES */
.note-card{background:#13131a;border:1px solid #1e1e24;border-radius:13px;padding:16px;margin-bottom:10px;animation:slideIn .2s ease;transition:border-color .15s}
.note-card:hover{border-color:#2a2a30}
.note-title-input{width:100%;background:transparent;border:none;outline:none;color:#e8e3d8;font-family:'Syne',sans-serif;font-size:16px;font-weight:700;padding:0;margin-bottom:8px}
.note-title-input::placeholder{color:#2a2a30}
.note-content-area{width:100%;background:transparent;border:none;outline:none;color:#999;font-size:13px;line-height:1.7;resize:none;padding:0;min-height:60px}
.note-content-area::placeholder{color:#2a2a2e}
.note-footer{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid #1a1a1e}
.note-date{font-size:11px;color:#2e2e34;flex:1}
.note-sort-btn{background:#1a1a1e;border:1px solid #2a2a2e;color:#555;border-radius:7px;padding:4px 10px;font-size:11px;transition:all .15s}
.note-sort-btn:hover{border-color:#555;color:#aaa}
.sort-items{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.sort-item{background:#1a1a1e;border-radius:9px;padding:10px 12px;animation:fadeIn .15s ease}
.sort-item-text{font-size:13px;color:#c0bdb5;margin-bottom:8px}
.sort-btns{display:flex;flex-wrap:wrap;gap:5px}
.smove{padding:4px 11px;border-radius:100px;border:1px solid #2a2a2e;background:transparent;color:#666;font-size:11px;transition:all .15s}
.smove:hover{border-color:#888;color:#e8e3d8;background:#1e1e24}
.smove.t{border-color:#3a4a2a;color:#7aaa6a}
.sdiscard{padding:4px 11px;border-radius:100px;border:1px solid #2a2a2e;background:transparent;color:#444;font-size:11px;transition:all .15s}
.sdiscard:hover{border-color:#8a3a3a;color:#8a5a5a}
.new-note-card{background:#0f0f10;border:1px dashed #2a2a2e;border-radius:13px;padding:16px;margin-bottom:14px;transition:border-color .15s}
.new-note-card:focus-within{border-color:#3a3a40;background:#111118}
/* CALENDAR */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calmtitle{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:#e8e3d8}
.calnav{background:#1a1a1e;border:1px solid #2a2a2e;color:#666;border-radius:7px;padding:5px 11px;font-size:12px;transition:all .15s}
.calnav:hover{border-color:#444;color:#ccc}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#1a1a1e;border:1px solid #1a1a1e;border-radius:12px;overflow:hidden;margin-bottom:14px}
.caldh{background:#0f0f10;padding:6px 3px;text-align:center;font-size:9px;color:#333;text-transform:uppercase;font-weight:600;letter-spacing:.06em}
.calcell{background:#0f0f10;min-height:62px;padding:5px;cursor:pointer;transition:background .1s}
.calcell:hover{background:#131318}
.calcell.om{opacity:.25}.calcell.tdy{background:#121620}.calcell.sel{background:#141a14;outline:1px solid #2a3a2a;outline-offset:-1px}
.cdn{font-size:11px;color:#3a3a40;font-weight:500;margin-bottom:3px}
.calcell.tdy .cdn{color:#7ab87a;font-weight:700}.calcell.sel .cdn{color:#e8e3d8}
.cdots{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px}
.ctdot{width:5px;height:5px;border-radius:50%}
.cchip{font-size:9px;border-radius:3px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:block}
.daypanel{background:#13131a;border:1px solid #1e1e28;border-radius:13px;padding:16px;margin-bottom:16px;animation:fadeIn .18s ease}
.dptitle{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:#e8e3d8;margin-bottom:12px}
.dpsec{font-size:10px;color:#3a3a40;letter-spacing:.1em;text-transform:uppercase;margin:10px 0 6px;font-weight:500}
.evform{background:#1a1a1e;border:1px solid #1e1e28;border-radius:9px;padding:11px;margin-bottom:10px}
.evrow{display:flex;gap:6px;margin-bottom:7px;flex-wrap:wrap}
.evinput{flex:1;min-width:100px;background:#111;border:1px solid #1e1e28;border-radius:7px;padding:8px 10px;color:#e8e6e0;font-size:13px;outline:none;transition:border-color .15s}
.evinput:focus{border-color:#3a3a40}.evinput::placeholder{color:#2a2a2e}
.evselect{background:#111;border:1px solid #1e1e28;border-radius:7px;padding:8px 10px;color:#c8c5bc;font-size:12px;outline:none}
.evitem{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #1a1a1e}
.evitem:last-child{border-bottom:none}
.evinfo{flex:1}.evtitle{font-size:13px;color:#b0ada5}.evtime{font-size:11px;color:#444;margin-top:1px}
.evtype-badge{font-size:10px;color:#444;background:#1a1a1e;border-radius:4px;padding:1px 6px;flex-shrink:0}
.dtask{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #1a1a1e}
.dtask:last-child{border-bottom:none}
.dttext{flex:1;font-size:13px;color:#888}.dttext.done{text-decoration:line-through;color:#3a3a40}
.dtsec{font-size:10px;color:#3a3a40;margin-left:4px}
/* REVIEW PENDING TASKS */
.pending-section{margin-top:4px}
.pending-task{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid #1a1a1e;animation:fadeIn .15s ease}
.pending-task:last-child{border-bottom:none}
.pt-info{flex:1;min-width:0}
.pt-text{font-size:14px;color:#b0ada5;line-height:1.4}.pt-text.done{text-decoration:line-through;color:#444}
.pt-meta{display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap}

function tkey(){return new Date().toISOString().slice(0,10)}

function bestStreak(id,log){let max=0,cur=0;Object.keys(log).sort().forEach(k=>{if(log[k]?.[id]){cur++;if(cur>max)max=cur;}else cur=0;});return max;}
function last7(){const o=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);o.push({key:d.toISOString().slice(0,10),lbl:i===0?'T':['S','M','T','W','T','F','S'][d.getDay()]});}return o;}

// ── AUTH ──
async function doAuth(){
  const email=S.email.trim(),pass=S.password.trim();
  if(!email||!pass){S.authErr="Please fill in both fields.";render();return;}
  if(S.authMode==='signup'&&pass.length<6){S.authErr="Password must be at least 6 characters.";render();return;}
  S.authErr='';render();
  if(S.authMode==='signin'){
    const{data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error){S.authErr=error.message==="Invalid login credentials"?"Wrong email or password.":error.message;render();return;}
    if(data.user)await startApp(data.user);
  } else {
    const{data,error}=await sb.auth.signUp({email,password:pass});
    if(error){S.authErr=error.message;render();return;}
    if(data.user){
      if(data.user.identities&&data.user.identities.length===0){S.authErr="This email is already registered. Sign in instead.";S.authMode='signin';render();return;}
      await startApp(data.user);
    }
  }
}
async function signOut(){await sb.auth.signOut();uid=null;Object.assign(S,{screen:"login",tasks:{},habits:[],habitLog:{},events:[],shopping:[],customSecs:[],tags:[],notes:[],email:"",password:"",authErr:""});render();}

// ── DATA ──
async function load(userId){
  try{
    const{data}=await sb.from('planner_data').select('*').eq('user_id',userId).single();
    if(data){
      const t=data.tasks||{};
      S.shopping=t._shopping||[];S.customSecs=t._customSecs||[];S.tags=t._tags||[];S.notes=t._notes||[];
      const{_shopping,_customSecs,_tags,_notes,...actual}=t;
      S.tasks=actual;S.habits=data.habits||[];S.habitLog=data.habit_log||{};S.events=data.events||[];
    }
    S.sync='synced';
  }catch(e){S.sync='error';}
}
async function save(){
  if(!uid)return;S.sync='syncing';render();
  try{
    const tasksToSave={...S.tasks,_shopping:S.shopping,_customSecs:S.customSecs,_tags:S.tags,_notes:S.notes};
    await sb.from('planner_data').upsert({user_id:uid,tasks:tasksToSave,habits:S.habits,habit_log:S.habitLog,events:S.events,updated_at:new Date().toISOString()},{onConflict:'user_id'});
    S.sync='synced';
  }catch(e){S.sync='error';}
  render();
}
function commit(){save();}

}

function setNoteTag(id,tagId){S.notes=S.notes.map(n=>n.id===id?{...n,tagId:tagId?Number(tagId):null}:n);commit();}
function startSort(noteId){
  const note=S.notes.find(n=>n.id===noteId);if(!note)return;
  const lines=note.content.split('\n').map(l=>l.trim()).filter(Boolean);
  S.sortNoteId=noteId;S.sortItems=lines.map(text=>({text,sorted:false}));render();
}
function moveSortItem(idx,sec){
  if(!S.tasks[sec])S.tasks[sec]=[];
  S.tasks[sec].push({id:Date.now(),text:S.sortItems[idx].text,done:false,notes:'',dueDate:'',subtasks:[],tagId:null});
  S.sortItems[idx]={...S.sortItems[idx],sorted:true};
  if(S.sortItems.every(i=>i.sorted)){S.sortNoteId=null;S.sortItems=[];}
  commit();
}
function discardSortItem(idx){S.sortItems[idx]={...S.sortItems[idx],sorted:true};if(S.sortItems.every(i=>i.sorted)){S.sortNoteId=null;S.sortItems=[];}render();}

function render(){
  const app=document.getElementById('app');
  if(S.screen!=='app'){app.innerHTML=renderAuth();return;}
  const pageTitle=NAV_ITEMS.find(n=>n.id===S.tab)?.label||'';
  let h=`
  <div class="backdrop${S.sidebarOpen?' open':''}" onclick="S.sidebarOpen=false;render()"></div>
  <div class="sidebar${S.sidebarOpen?' open':''}">
    <div class="sidebar-head">
      <span class="sidebar-logo">✦ Planner</span>
      <button class="sidebar-close" onclick="S.sidebarOpen=false;render()">×</button>
    </div>
    <nav class="sidebar-nav">`;
  NAV_ITEMS.forEach(n=>{h+=`<button class="snav-item${S.tab===n.id?' active':''}" onclick="S.tab='${n.id}';S.sidebarOpen=false;render()">
    <span class="snav-icon">${n.icon}</span>${n.label}</button>`;});
  h+=`</nav></div>
  <div class="shell">
    <div class="topbar">
      <button class="star-btn" onclick="S.sidebarOpen=true;render()">✦</button>
      <span class="page-title">${esc(pageTitle)}</span>
      <div class="topbar-right"><button class="sout" onclick="signOut()">Sign out</button></div>
    </div>
    <div class="scroll"><div class="wrap">`;
  if(S.tab==='review')   h+=renderReview();
  if(S.tab==='planner')  h+=renderPlanner();
  if(S.tab==='everyday') h+=renderHabits();
  if(S.tab==='notes')    h+=renderNotes();
  if(S.tab==='shopping') h+=renderShopping();
  h+=`</div></div></div>`;
  const sl={synced:'Synced',syncing:'Syncing…',error:'Sync error'}[S.sync]||'';
  h+=`<div class="syncbar"><div class="sdot ${S.sync}"></div><span>${sl}</span></div>`;
  app.innerHTML=h;
  if(S.editId){const el=document.getElementById('eInp');if(el){el.focus();el.selectionStart=el.selectionEnd=el.value.length;}}
  if(S.addingSec){const el=document.getElementById('newSecInp');if(el)el.focus();}
  Object.keys(S.subInputs).forEach(id=>{const el=document.getElementById('si_'+id);if(el)el.value=S.subInputs[id]||'';});
}

// ── REVIEW ──
function renderReview(){
  const today=tkey();
  const hour=new Date().getHours();
  const greeting=hour<12?'Good morning ☀️':hour<17?'Good afternoon 🌤':hour<21?'Good evening 🌙':'Good night 🌙';
  const yestKey=new Date(new Date().setDate(new Date().getDate()-1)).toISOString().slice(0,10);
  const missedYest=S.habits.filter(h=>!S.habitLog[yestKey]?.[h.id]);

  let h=`<div class="rev-greeting">${greeting}</div>
  <div class="rev-date">${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>`;

  // ── CALENDAR ──
  h+=renderCalendar();

  // ── HABITS MISSED ──
  if(S.habits.length&&missedYest.length){
    h+=`<div class="divr"></div>
    <div style="font-size:11px;color:#7a4a3a;text-transform:uppercase;letter-spacing:.1em;font-weight:600;margin-bottom:10px">🔥 Habits missed yesterday · ${missedYest.length}/${S.habits.length}</div>
    <div style="background:#13131a;border:1px solid #1e1e24;border-radius:12px;padding:12px 14px;margin-bottom:4px">`;
    missedYest.forEach(h=>{h+=`<div class="hm-row"><div class="hm-dot"></div>${esc(h.text)}</div>`;});
    h+=`</div>`;
  } else if(S.habits.length){
    h+=`<div class="divr"></div>
    <div style="font-size:12px;color:#4a6a4a;margin-bottom:16px">🔥 You nailed all your habits yesterday!</div>`;
  }

  // ── ALL PENDING TASKS ──
  h+=`<div class="divr"></div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
    <div style="font-size:11px;color:#555;text-transform:uppercase;letter-spacing:.1em;font-weight:600">All Pending Tasks</div>
  </div>`;
  h+=filterBar(S.pendingFilter,'setPendingFilter');

  const flat=allTasksFlat().filter(t=>!t.done);
  // sort: overdue first, then by dueDate asc, then today section no-date, then rest
  const overdue=flat.filter(t=>t.dueDate&&t.dueDate<today);
  const dueToday=flat.filter(t=>t.dueDate===today);
  const upcoming=flat.filter(t=>t.dueDate&&t.dueDate>today);
  const todaySec=flat.filter(t=>!t.dueDate&&t.sec==='today');
  const rest=flat.filter(t=>!t.dueDate&&t.sec!=='today');
  const sorted=[...overdue,...dueToday,...upcoming,...todaySec,...rest];
  const filtered=S.pendingFilter?sorted.filter(t=>t.tagId==S.pendingFilter):sorted;

  if(!filtered.length){h+=`<div class="empty" style="padding:30px 0"><div class="etxt">No pending tasks${S.pendingFilter?' with this tag':''}.</div></div>`;}
  else{
    h+=`<div class="pending-section">`;
    filtered.forEach(t=>{
      const rel=relDate(t.dueDate);
      h+=`<div class="pending-task">
        <button class="cbox${t.done?' done':''}" onclick="toggleTask('${t.sec}',${t.id})">${t.done?iChk:''}</button>
        <div class="pt-info">
          <div class="pt-text">${esc(t.text)}</div>
          <div class="pt-meta">
            ${t.dueDate?`<span class="pt-date${rel?' '+rel:''}">${fmtDate(t.dueDate)}</span>`:''}
            <span class="pt-sec">${t.sec}</span>
            ${tagBadge(t.tagId)}
          </div>
        </div>
      </div>`;
    });
    h+=`</div>`;
  }
  return h;
}

function renderCalendar(){
  const y=S.calY,m=S.calM,today=tkey();
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),dimp=new Date(y,m,0).getDate();
  let h=`<div class="calhead">
    <button class="calnav" onclick="prevMonth()">← Prev</button>
    <div class="calmtitle">${months[m]} ${y}</div>

  </div><div class="calgrid">`;
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>{h+=`<div class="caldh">${d}</div>`;});
  const total=Math.ceil((first+dim)/7)*7;
  for(let i=0;i<total;i++){
    let day,mo=0;

        </div>

          <select class="evselect" onchange="S.newEvType=this.value">`;
    EV_TYPES.forEach(t=>{h+=`<option value="${t.v}"${S.newEvType===t.v?' selected':''}>${t.l}</option>`;});
    h+=`</select>
          <select class="evselect" onchange="S.newEvTag=this.value?Number(this.value):null">
            <option value="">No tag</option>`;
    S.tags.forEach(t=>{h+=`<option value="${t.id}"${S.newEvTag==t.id?' selected':''}>${esc(t.name)}</option>`;});
    h+=`</select>
        </div>
        <button class="addbtn" onclick="S.newEvDate='${S.selDay}';addEvent()" style="width:100%;margin-top:4px">Add event</button>
      </div>`;
    if(se.length){
      h+=`<div class="dpsec">Events</div>`;
      se.forEach(e=>{

  </div>

  h+=filterBar(S.filterTag,'setTaskFilter');
  const filteredTodo=S.filterTag?todo.filter(t=>t.tagId==S.filterTag):todo;

  h+=`<div class="addrow">

        if(item.sorted)return;
        h+=`<div class="sort-item"><div class="sort-item-text">${esc(item.text)}</div><div class="sort-btns">
          <button class="smove t" onclick="moveSortItem(${idx},'today')">Today</button>
          <button class="smove" onclick="moveSortItem(${idx},'tomorrow')">Tomorrow</button>
          <button class="smove" onclick="moveSortItem(${idx},'thisweek')">This Week</button>
          <button class="smove" onclick="moveSortItem(${idx},'future')">Someday</button>`;
        S.customSecs.forEach(cs=>{h+=`<button class="smove" onclick="moveSortItem(${idx},'${cs.id}')">${esc(cs.label)}</button>`;});
        h+=`<button class="sdiscard" onclick="discardSortItem(${idx})">✕</button></div></div>`;
      });
      h+=`</div>`;
    }
    h+=`<div class="note-footer">
      <span class="note-date">${new Date(note.updatedAt||note.createdAt).toLocaleDateString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span>
      ${tg?`<span class="tag-pill" style="background:${tg.color}22;color:${tg.color}">${esc(tg.name)}</span>`:''}
      <select class="tag-select" style="font-size:10px;padding:3px 7px" onchange="setNoteTag(${note.id},this.value)"><option value="">Tag…</option>`;
    S.tags.forEach(t=>{h+=`<option value="${t.id}"${note.tagId==t.id?' selected':''}>${esc(t.name)}</option>`;});
    h+=`</select>
      <button class="note-sort-btn" onclick="${isSorting?`S.sortNoteId=null;S.sortItems=[];render()`:`startSort(${note.id})`}">${isSorting?'Cancel sort':'Sort into planner'}</button>
      <button class="ibtn" onclick="deleteNote(${note.id})">${iDel}</button>
    </div></div>`;
  });
  return h;
}
function setNoteFilter(id){S.noteFilter=id;render();}

// ── AUTH SCREEN ──
function renderAuth(){
  const isSignup=S.authMode==='signup';
  return`<div class="center"><div class="acard">
    <div class="alogo">✦ Planner</div>
    <div class="atitle">${isSignup?'Create account':'Welcome back'}</div>
    <div class="asub">${isSignup?'Set up your account to get started.':'Sign in to your planner.'}</div>
    <div class="alabel">Email</div>
    <input class="ainput" type="email" placeholder="you@example.com" value="${esc(S.email)}" oninput="S.email=this.value" onkeydown="if(event.key==='Enter')doAuth()" autofocus/>
    <div class="alabel">Password</div>
    <input class="ainput" type="password" placeholder="${isSignup?'Choose a password (6+ chars)':'Your password'}" value="${esc(S.password)}" oninput="S.password=this.value" onkeydown="if(event.key==='Enter')doAuth()"/>
    <button class="abtn" onclick="doAuth()">${isSignup?'Create account →':'Sign in →'}</button>
    ${S.authErr?`<div class="aerr">${esc(S.authErr)}</div>`:''}
    <button class="atoggle" onclick="S.authMode=S.authMode==='signin'?'signup':'signin';S.authErr='';render()">
      ${isSignup?'Already have an account? Sign in':'No account? Create one'}
    </button>
    ${isSignup?`<div class="anote">After creating your account, go to your <a href="${SUPA_URL.replace('https://','https://app.')}" target="_blank">Supabase dashboard</a> → Authentication → Providers → Email → disable "Confirm email" for instant access.</div>`:''}
  </div></div>`;
}

// ── BOOT ──
async function startApp(user){uid=user.id;S.screen='app';S.sync='syncing';render();await load(uid);render();}
async function boot(){
  const{data}=await sb.auth.getSession();
  if(data?.session?.user){await startApp(data.session.user);return;}
  S.screen='login';render();
}
sb.auth.onAuthStateChange(async(event,session)=>{if(event==='SIGNED_IN'&&session?.user&&S.screen!=='app')await startApp(session.user);if(event==='SIGNED_OUT')render();});
boot();
</script>
