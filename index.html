<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
/* PALETTE */
:root{
 --bg:#fffdfa;--bg2:#fefafa;--bg3:#f4f0eb;
 --card:#ffffff;--card2:#faf8f5;
 --border:#e8e2d9;--border2:#d4ccc2;
 --text:#111827;--text2:#6b7280;--text3:#9ca3af;
 --primary:#bc0a0a;--primary-h:#a00808;
 --secondary:#d92452;
 --accent:#2271ee;
 --lavender:#e5c4f7;
 --success:#22c55e;--warning:#eab308;--error:#ef4444;
 --teal:#90b6b6;
 --shadow:0 1px 3px rgba(17,24,39,.08),0 1px 2px rgba(17,24,39,.04);
 --shadow-md:0 4px 12px rgba(17,24,39,.10),0 2px 4px rgba(17,24,39,.06);
 --shadow-lg:0 10px 30px rgba(17,24,39,.14),0 4px 10px rgba(17,24,39,.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Mulish','Segoe UI',sans-serif}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
input,button,textarea,select{font-family:inherit}button{cursor:pointer}

/* TOPBAR */
.topbar{display:flex;align-items:center;padding:0 18px;height:54px;border-bottom:1px solid var(--border);background:var(--card);position:sticky;top:0;z-index:90;flex-shrink:0;box-shadow:var(--shadow)}
.star-btn{width:34px;height:34px;border-radius:8px;border:none;background:transparent;color:var(--primary);font-size:18px;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
.star-btn:hover{background:var(--bg3)}
.page-title{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;color:var(--text);margin-left:10px}
.topbar-right{margin-left:auto}
.sout{font-size:12px;color:var(--text3);background:none;border:none;font-weight:600;transition:color .15s}.sout:hover{color:var(--primary)}

/* SIDEBAR */
.backdrop{position:fixed;inset:0;background:rgba(17,24,39,.4);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.open{opacity:1;pointer-events:all}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;background:var(--card);border-right:1px solid var(--border);z-index:201;transform:translateX(-100%);transition:transform .22s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.sidebar.open{transform:none}
.sidebar-head{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border)}
.sidebar-logo{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;color:var(--text);letter-spacing:-.01em}
.sidebar-logo span{color:var(--primary)}
.sidebar-close{margin-left:auto;background:none;border:none;color:var(--text3);font-size:20px;line-height:1;transition:color .15s}.sidebar-close:hover{color:var(--text)}
.sidebar-nav{flex:1;overflow-y:auto;padding:10px 10px}
.snav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;color:var(--text2);font-size:14px;font-weight:600;transition:all .15s;border:none;background:none;width:100%;text-align:left;border-radius:10px;margin-bottom:2px}
.snav-item:hover{color:var(--text);background:var(--bg3)}
.snav-item.active{color:var(--primary);background:#bc0a0a12;font-weight:700}
.snav-icon{font-size:16px;width:22px;text-align:center}

/* SHELL */
.shell{display:flex;flex-direction:column;height:100vh}.scroll{flex:1;overflow-y:auto}
.wrap{max-width:760px;margin:0 auto;padding:22px 20px 90px}

/* SYNC */
.syncbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);padding:7px 20px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;color:var(--text3);z-index:80;font-weight:500}
.sdot{width:5px;height:5px;border-radius:50%;background:var(--text3);flex-shrink:0}
.sdot.synced{background:var(--success)}.sdot.syncing{background:var(--warning);animation:pulse 1s infinite}.sdot.error{background:var(--error)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* AUTH */
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 20px;background:var(--bg3)}
.acard{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:38px;max-width:400px;width:100%;box-shadow:var(--shadow-lg)}
.alogo{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;color:var(--primary);letter-spacing:.02em;text-transform:uppercase;margin-bottom:22px}
.atitle{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--text);margin-bottom:6px}
.asub{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:22px}
.alabel{font-size:11px;color:var(--text2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px;font-weight:700}
.ainput{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:12px 13px;color:var(--text);font-size:14px;outline:none;margin-bottom:12px;transition:border-color .15s;font-weight:500}
.ainput:focus{border-color:var(--primary)}.ainput::placeholder{color:var(--text3)}
.abtn{width:100%;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;transition:all .15s}
.abtn:hover{background:var(--primary-h)}.abtn:disabled{opacity:.5;cursor:not-allowed}
.atoggle{width:100%;background:transparent;border:1.5px solid var(--border);color:var(--text2);border-radius:10px;padding:11px;font-size:13px;font-weight:600;transition:all .15s;margin-top:8px}
.atoggle:hover{border-color:var(--border2);color:var(--text)}
.aerr{font-size:13px;color:var(--error);margin-top:8px;text-align:center;font-weight:600}

/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(17,24,39,.5);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:24px 22px 32px;animation:slideUp .2s ease;box-shadow:var(--shadow-lg)}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.modal-title{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;color:var(--text);margin-bottom:20px}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 20px}
.mfield{margin-bottom:15px}
.mfield label{display:block;font-size:11px;color:var(--text2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px;font-weight:700}
.minput{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:9px;padding:11px 13px;color:var(--text);font-size:14px;outline:none;transition:border-color .15s;font-weight:500}
.minput:focus{border-color:var(--primary)}.minput::placeholder{color:var(--text3)}
.mselect{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:9px;padding:10px 13px;color:var(--text2);font-size:13px;outline:none;font-weight:500}
.mtextarea{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:9px;padding:11px 13px;color:var(--text2);font-size:13px;line-height:1.6;outline:none;resize:none;min-height:72px;transition:border-color .15s;font-weight:500}
.mtextarea:focus{border-color:var(--primary)}.mtextarea::placeholder{color:var(--text3)}
.modal-actions{display:flex;gap:8px;margin-top:22px}
.save-btn{flex:1;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;transition:all .15s}
.save-btn:hover{background:var(--primary-h)}
.cancel-btn{background:var(--bg3);color:var(--text2);border:1.5px solid var(--border);border-radius:10px;padding:13px 18px;font-size:14px;font-weight:600;transition:all .15s}
.cancel-btn:hover{border-color:var(--border2);color:var(--text)}
.del-btn{background:#fff0f0;color:var(--error);border:1.5px solid #fecaca;border-radius:10px;padding:13px 18px;font-size:14px;font-weight:600;transition:all .15s}
.del-btn:hover{background:#fee2e2}

/* SHARED */
.sectitle{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--text);letter-spacing:-.02em;margin-bottom:4px}
.secsub{font-size:13px;color:var(--text2);margin-bottom:14px;font-weight:500}
.divr{height:1px;background:var(--border);margin:18px 0}
.ibtn{background:none;border:none;padding:5px;color:var(--text3);transition:color .15s;display:flex;align-items:center;flex-shrink:0}
.ibtn:hover{color:var(--primary)}
.empty{text-align:center;padding:44px 0}
.eicon{font-size:26px;margin-bottom:10px}.etxt{font-size:14px;color:var(--text3);font-weight:500}

/* PRIMARY ADD BTN */
.primary-add{display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:700;transition:all .15s;margin-bottom:18px;box-shadow:0 2px 8px rgba(188,10,10,.2)}
.primary-add:hover{background:var(--primary-h)}

/* FAB */
.fab{position:fixed;bottom:52px;right:18px;width:52px;height:52px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:24px;display:flex;align-items:center;justify-content:center;z-index:70;box-shadow:0 4px 16px rgba(188,10,10,.35);transition:all .15s}
.fab:hover{background:var(--primary-h);transform:scale(1.05)}
.fab-menu{position:fixed;bottom:114px;right:18px;z-index:70;display:flex;flex-direction:column;gap:7px;align-items:flex-end;animation:fadeIn .15s ease}
.fab-item{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--border);border-radius:100px;padding:8px 15px;font-size:13px;color:var(--text);font-weight:600;white-space:nowrap;box-shadow:var(--shadow-md);transition:all .15s}
.fab-item:hover{border-color:var(--primary);color:var(--primary)}

/* TAGS */
.tag-pill{display:inline-flex;align-items:center;gap:4px;border-radius:100px;padding:2px 9px;font-size:11px;font-weight:700;flex-shrink:0}
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filter-chip{padding:4px 12px;border-radius:100px;border:1.5px solid var(--border);background:transparent;color:var(--text2);font-size:12px;font-weight:600;transition:all .15s;cursor:pointer}
.filter-chip:hover{border-color:var(--border2);color:var(--text)}
.filter-chip.on{font-weight:700}

/* SECTION NAV */
.secnav{display:flex;gap:6px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none;align-items:center}
.secnav::-webkit-scrollbar{display:none}
.sbtn{padding:6px 14px;border-radius:100px;border:1.5px solid var(--border);background:transparent;color:var(--text2);font-size:12px;font-weight:600;transition:all .15s;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:4px}
.sbtn:hover{border-color:var(--border2);color:var(--text);background:var(--bg3)}
.sbtn.active{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:700}
.badge{font-size:10px;font-weight:700;padding:1px 6px;border-radius:100px;background:rgba(255,255,255,.25);color:#fff}
.sbtn:not(.active) .badge{background:var(--bg3);color:var(--text2)}
.add-sec-btn{width:28px;height:28px;border-radius:50%;border:1.5px dashed var(--border2);background:transparent;color:var(--text3);font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.add-sec-btn:hover{border-color:var(--primary);color:var(--primary)}
.new-sec-input{background:var(--bg);border:1.5px solid var(--primary);border-radius:100px;padding:5px 12px;color:var(--text);font-size:12px;font-weight:600;outline:none;width:120px;flex-shrink:0}

/* TASK LIST */
.tasklist{border-top:1px solid var(--border)}
.trow{display:flex;align-items:center;gap:9px;padding:12px 0;border-bottom:1px solid var(--border);animation:fadeIn .18s ease}
.cbox{width:19px;height:19px;flex-shrink:0;border:2px solid var(--border2);border-radius:5px;background:transparent;display:flex;align-items:center;justify-content:center;transition:all .15s}
.cbox:hover{border-color:var(--primary)}.cbox.done{background:var(--primary);border-color:var(--primary)}
.twrap{flex:1;min-width:0}
.ttext{font-size:14px;color:var(--text);line-height:1.4;word-break:break-word;font-weight:500}
.ttext.done{text-decoration:line-through;color:var(--text3)}
.tmeta{display:flex;align-items:center;gap:5px;margin-top:3px;flex-wrap:wrap}
.tdatetag{font-size:10px;color:var(--text2);background:var(--bg3);border-radius:5px;padding:2px 7px;font-weight:600}
.done-lbl{font-size:10px;letter-spacing:.08em;color:var(--text3);text-transform:uppercase;margin:14px 0 4px;font-weight:700}
.done-row{opacity:.5}

/* SUBTASK IN MODAL */
.sub-list{border:1.5px solid var(--border);border-radius:9px;overflow:hidden;margin-bottom:9px}
.sub-item{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--border)}
.sub-item:last-child{border-bottom:none}
.scbox{width:15px;height:15px;flex-shrink:0;border:2px solid var(--border2);border-radius:3px;background:transparent;display:flex;align-items:center;justify-content:center;transition:all .15s}
.scbox.done{background:var(--primary);border-color:var(--primary)}
.sub-text{flex:1;font-size:13px;color:var(--text2);font-weight:500}.sub-text.done{text-decoration:line-through;color:var(--text3)}
.sdel{background:none;border:none;color:var(--text3);padding:2px;transition:color .15s;display:flex;align-items:center}.sdel:hover{color:var(--error)}
.sub-add-row{display:flex;gap:6px}
.sub-input{flex:1;background:var(--bg);border:1.5px solid var(--border);border-radius:7px;padding:7px 10px;color:var(--text);font-size:13px;outline:none;font-weight:500}
.sub-input::placeholder{color:var(--text3)}
.sub-add-btn{background:var(--bg3);border:1.5px solid var(--border);color:var(--text2);border-radius:7px;padding:7px 12px;font-size:12px;font-weight:700;transition:all .15s}
.sub-add-btn:hover{border-color:var(--primary);color:var(--primary)}

/* EVENT LIST */
.ev-card{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:13px 15px;margin-bottom:9px;display:flex;align-items:center;gap:10px;animation:fadeIn .18s ease;box-shadow:var(--shadow)}
.ev-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.ev-info{flex:1;min-width:0}
.ev-title{font-size:14px;color:var(--text);font-weight:600}
.ev-meta{display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap;font-size:11px;color:var(--text2);font-weight:500}

/* CALENDAR */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calmtitle{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:var(--text)}
.calnav{background:var(--bg3);border:1.5px solid var(--border);color:var(--text2);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;transition:all .15s}
.calnav:hover{border-color:var(--primary);color:var(--primary)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1.5px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px}
.caldh{background:var(--bg3);padding:7px 3px;text-align:center;font-size:9px;color:var(--text3);text-transform:uppercase;font-weight:700;letter-spacing:.07em}
.calcell{background:var(--card);min-height:60px;padding:5px;cursor:pointer;transition:background .1s}
.calcell:hover{background:var(--bg3)}
.calcell.om{opacity:.3}.calcell.tdy{background:#fff8f8}.calcell.sel{background:#bc0a0a0a;outline:1.5px solid var(--primary);outline-offset:-1.5px}
.cdn{font-size:11px;color:var(--text3);font-weight:600;margin-bottom:2px}
.calcell.tdy .cdn{color:var(--primary);font-weight:800}.calcell.sel .cdn{color:var(--primary)}
.cdots{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px}
.ctdot{width:5px;height:5px;border-radius:50%}
.cchip{font-size:9px;border-radius:3px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:block;font-weight:600}
.daypanel{background:var(--card);border:1.5px solid var(--border);border-radius:13px;padding:16px;margin-bottom:14px;animation:fadeIn .15s ease;box-shadow:var(--shadow)}
.dptitle{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;color:var(--text);margin-bottom:12px}
.dpsec{font-size:10px;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin:10px 0 6px;font-weight:700}
.dp-add-btns{display:flex;gap:7px;margin-bottom:11px}
.dp-add-btn{flex:1;background:var(--bg3);border:1.5px solid var(--border);color:var(--text2);border-radius:9px;padding:9px;font-size:12px;font-weight:600;transition:all .15s}
.dp-add-btn:hover{border-color:var(--primary);color:var(--primary)}

/* REVIEW PENDING */
.pending-task{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid var(--border)}
.pending-task:last-child{border-bottom:none}
.pt-info{flex:1;min-width:0}
.pt-text{font-size:14px;color:var(--text);line-height:1.4;font-weight:500}.pt-text.done{text-decoration:line-through;color:var(--text3)}
.pt-meta{display:flex;align-items:center;gap:5px;margin-top:3px;flex-wrap:wrap;font-size:10px;color:var(--text2);font-weight:600}
.pt-date.overdue{color:var(--error)}.pt-date.today{color:var(--success)}

/* HABITS */
.htop{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.ptrack{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-top:5px;width:60px}
.pfill{height:100%;background:var(--success);border-radius:2px;transition:width .4s ease}
.hcard{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:13px 15px;display:flex;flex-direction:column;gap:9px;margin-bottom:8px;animation:fadeIn .18s ease;box-shadow:var(--shadow)}
.hcard.ht{border-color:#bbf7d0;background:#f0fdf4}
.htoprow{display:flex;align-items:center;gap:9px}
.htoggle{width:24px;height:24px;border-radius:50%;border:2px solid var(--border2);background:transparent;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.htoggle.done{background:var(--success);border-color:var(--success)}
.hname{flex:1;font-size:14px;color:var(--text2);font-weight:600}.hname.done{color:var(--success)}
.hstreak{display:flex;align-items:center;gap:3px;background:#fef3c7;border-radius:100px;padding:2px 9px}
.hstreakn{font-size:12px;font-weight:700;color:#d97706}
.hdots{display:flex;align-items:center;gap:5px}
.dcol{display:flex;flex-direction:column;align-items:center;gap:3px}
.hdot{width:9px;height:9px;border-radius:50%;border:2px solid var(--border);background:transparent}
.hdot.hit{background:var(--success);border-color:var(--success)}.hdot.td{border:2px solid var(--primary)}
.dlbl{font-size:8px;color:var(--text3);font-weight:600}
.best{margin-left:auto;font-size:10px;color:var(--text3);font-weight:600}.best span{color:var(--success)}

/* NOTES */
.note-card{background:var(--card);border:1.5px solid var(--border);border-radius:13px;padding:16px;margin-bottom:10px;animation:fadeIn .18s ease;transition:border-color .15s;box-shadow:var(--shadow)}
.note-card:hover{border-color:var(--border2)}
.note-title-input{width:100%;background:transparent;border:none;outline:none;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;padding:0;margin-bottom:6px}
.note-title-input::placeholder{color:var(--text3)}
.note-body{width:100%;background:transparent;border:none;outline:none;color:var(--text2);font-size:13px;line-height:1.7;resize:none;padding:0;min-height:56px;font-weight:500}
.note-body::placeholder{color:var(--text3)}
.note-footer{display:flex;align-items:center;gap:7px;margin-top:10px;padding-top:9px;border-top:1px solid var(--border);flex-wrap:wrap}
.note-date{font-size:11px;color:var(--text3);font-weight:600}
.sort-items{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.sort-item{background:var(--bg3);border-radius:9px;padding:10px 12px;border:1px solid var(--border)}
.sort-item-text{font-size:13px;color:var(--text);margin-bottom:8px;font-weight:500}
.sort-btns{display:flex;flex-wrap:wrap;gap:5px}
.smove{padding:4px 11px;border-radius:100px;border:1.5px solid var(--border);background:transparent;color:var(--text2);font-size:11px;font-weight:600;transition:all .15s}
.smove:hover{border-color:var(--primary);color:var(--primary)}
.smove.t{border-color:var(--primary);color:var(--primary)}
.sdiscard{padding:4px 11px;border-radius:100px;border:1.5px solid var(--border);background:transparent;color:var(--text3);font-size:11px;font-weight:600}
.sdiscard:hover{border-color:var(--error);color:var(--error)}

/* SHOPPING */
.shoprow{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid var(--border)}
.shoprow:last-child{border-bottom:none}
.gcheck{width:19px;height:19px;flex-shrink:0;border:2px solid var(--success);border-radius:5px;background:transparent;display:flex;align-items:center;justify-content:center;transition:all .15s}
.gcheck:hover{border-color:#16a34a}.gcheck.done{background:var(--success);border-color:var(--success)}
.shopwrap{flex:1;min-width:0}
.shoptext{font-size:14px;color:var(--text);font-weight:500}.shoptext.done{text-decoration:line-through;color:var(--text3)}

/* TAG MANAGER */
.tag-card{display:flex;align-items:center;gap:11px;padding:12px 15px;background:var(--card);border:1.5px solid var(--border);border-radius:11px;margin-bottom:8px;box-shadow:var(--shadow)}
.tcolor-swatch{width:28px;height:28px;border-radius:50%;flex-shrink:0;cursor:pointer;border:3px solid transparent;transition:all .1s}
.tcolor-swatch:hover{transform:scale(1.1)}
.tcolor-swatch.sel{border-color:var(--text)}

@media(max-width:600px){
 .wrap{padding:14px 12px 90px}.topbar{padding:0 14px}
 .calcell{min-height:46px}.cchip{display:none}.acard{padding:28px 18px}.sidebar{width:84vw}
 .modal{padding:20px 16px 30px}
}

// UTILS 
function tkey(){return new Date().toISOString().slice(0,10)}
function dkey(y,m,d){return`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmtDate(ds){if(!ds)return'';const d=new Date(ds+'T12:00:00');return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
function relDate(ds){if(!ds)return null;const t=tkey();if(ds<t)return'overdue';if(ds===t)return'today';return null;}
function streak(id,log){let n=0,b=new Date();for(let i=0;i<365;i++){const d=new Date(b);d.setDate(d.getDate()-i);if(log[d.toISOString().slice(0,10)]?.[id])n++;else break;}return n;}
function bestStreak(id,log){let max=0,cur=0;Object.keys(log).sort().forEach(k=>{if(log[k]?.[id]){cur++;if(cur>max)max=cur;}else cur=0;});return max;}
function last7(){const o=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);o.push({key:d.toISOString().slice(0,10),lbl:i===0?'T':['S','M','T','W','T','F','S'][d.getDay()]});}return o;}
function allTasksFlat(){const o=[];Object.entries(S.tasks).forEach(([sec,list])=>{if(Array.isArray(list))list.forEach(t=>o.push({...t,sec}));});return o;}
function tasksForDay(ds){return allTasksFlat().filter(t=>t.dueDate===ds)}
function eventsForDay(ds){return(S.events||[]).filter(e=>e.date===ds)}
function getTag(id){return S.tags.find(t=>t.id==id)||null}
function allSecs(){return[...BASE_SECS,...S.customSecs]}
function tagBadge(tagId){const t=getTag(tagId);if(!t)return'';return`<span class="tag-pill" style="background:${t.color}22;color:${t.color}">${esc(t.name)}</span>`;}
function evTypeLabel(v){return EV_TYPES.find(t=>t.v===v)?.l||' Event';}

// AUTH 
async function doAuth(){
 const email=S.email.trim(),pass=S.password.trim();
 if(!email||!pass){S.authErr="Fill in both fields.";render();return;}
 if(S.authMode==='signup'&&pass.length<6){S.authErr="Password must be 6+ chars.";render();return;}
 S.authErr='';
 if(S.authMode==='signin'){
 const{data,error}=await sb.auth.signInWithPassword({email,password:pass});
 if(error){S.authErr="Wrong email or password.";render();return;}
 if(data.user)await startApp(data.user);
 } else {
 const{data,error}=await sb.auth.signUp({email,password:pass});
 if(error){S.authErr=error.message;render();return;}
 if(data.user){if(!data.user.identities?.length){S.authErr="Email already registered. Sign in instead.";S.authMode='signin';render();return;}await startApp(data.user);}
 }
}
async function signOut(){await sb.auth.signOut();uid=null;Object.assign(S,{screen:"login",tasks:{},habits:[],habitLog:{},events:[],shopping:[],customSecs:[],tags:[],notes:[],email:"",password:"",authErr:""});render();}

// DATA 
async function load(userId){
 try{
 const{data}=await sb.from('planner_data').select('*').eq('user_id',userId).single();
 if(data){
 const t=data.tasks||{};
 S.shopping=t._shopping||[];S.customSecs=t._customSecs||[];S.tags=t._tags||[];S.notes=t._notes||[];
 const{_shopping,_customSecs,_tags,_notes,...actual}=t;
 S.tasks=actual;S.habits=data.habits||[];S.habitLog=data.habit_log||{};S.events=data.events||[];
 }
 S.sync='synced';
 }catch(e){S.sync='error';}
}
async function save(){
 if(!uid)return;S.sync='syncing';render();
 try{
 const tasksToSave={...S.tasks,_shopping:S.shopping,_customSecs:S.customSecs,_tags:S.tags,_notes:S.notes};
 await sb.from('planner_data').upsert({user_id:uid,tasks:tasksToSave,habits:S.habits,habit_log:S.habitLog,events:S.events,updated_at:new Date().toISOString()},{onConflict:'user_id'});
 S.sync='synced';
 }catch(e){S.sync='error';}
 render();
}
function commit(){save();}

 if(isSorting&&S.sortItems.length){
 h+=`<div class="sort-items">`;
 S.sortItems.forEach((item,idx)=>{if(item.sorted)return;h+=`<div class="sort-item"><div class="sort-item-text">${esc(item.text)}</div><div class="sort-btns">`;S.customSecs.forEach(cs=>{h+=`<button class="smove" onclick="moveSortItem(${idx},'${cs.id}')">${esc(cs.label)}</button>`;});h+=`<button class="sdiscard" onclick="discardSortItem(${idx})">x</button></div></div>`;});
 h+=`</div>`;
 }
 h+=`<div class="note-footer">
 <span class="note-date">${new Date(note.updatedAt||note.createdAt).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span>
 ${tg?`<span class="tag-pill" style="background:${tg.color}22;color:${tg.color}">${esc(tg.name)}</span>`:''}
 <select class="filter-chip" style="border:1px solid #ddd8d2;padding:3px 8px;font-size:11px;background:#f5f3ef;color:#666;border-radius:100px;outline:none" onchange="S.notes=S.notes.map(n=>n.id===${note.id}?{...n,tagId:this.value?Number(this.value):null}:n);commit()"><option value="">Tag…</option>${S.tags.map(t=>`<option value="${t.id}"${note.tagId==t.id?' selected':''}>${esc(t.name)}</option>`).join('')}</select>
 <button style="background:#f5f3ef;border:1px solid #ddd8d2;color:#6b7280;border-radius:7px;padding:4px 10px;font-size:11px;transition:all .15s" onclick="${isSorting?`S.sortNoteId=null;S.sortItems=[];render()`:`startSort(${note.id})`}">${isSorting?'Cancel':'Sort into tasks'}</button>
 <button class="ibtn" onclick="deleteNote(${note.id})">${iDel}</button>
 </div></div>`;
 });
 return h;
}
function setNoteFilter(id){S.noteFilter=id;render();}

// SHOPPING 
function renderShopping(){
 const pending=S.shopping.filter(g=>!g.done),bought=S.shopping.filter(g=>g.done);
 const fp=S.shopFilter?pending.filter(g=>g.tagId==S.shopFilter):pending;
 const fb=S.shopFilter?bought.filter(g=>g.tagId==S.shopFilter):bought;
 let h=`<div class="sectitle">Shopping List</div><div class="secsub">${pending.length} to get · ${bought.length} bought</div>`;
 h+=filterBar(S.shopFilter,'setShopFilter');
 h+=`<button class="primary-add" onclick="openModal('addShop')">+ Add item</button>`;
 if(bought.length)h+=`<button onclick="clearBought()" style="background:transparent;border:1px solid #ddd8d2;color:#6b7280;border-radius:8px;padding:7px 13px;font-size:12px;margin-bottom:12px;transition:all .15s" onmouseover="this.style.borderColor='#9a4a4a';this.style.color='#9a5a5a'" onmouseout="this.style.borderColor='#2a2a2e';this.style.color='#555'">Clear bought (${bought.length})</button>`;
 if(!S.shopping.length)return h+`<div class="empty"><div class="eicon">—</div><div class="etxt">Empty list.</div></div>`;
 fp.forEach(g=>{h+=renderShopRow(g,false);});
 if(fb.length){h+=`<div class="done-lbl">Bought</div>`;fb.forEach(g=>{h+=renderShopRow(g,true);});}
 return h;
}
function setShopFilter(id){S.shopFilter=id;render();}
function renderShopRow(g,isDone){
 const tg=getTag(g.tagId);
 return`<div class="shoprow${isDone?' done-row':''}">
 <button class="gcheck${isDone?' done':''}" onclick="toggleShop(${g.id})">${isDone?iGChk:''}</button>
 <div class="shopwrap">
 <div class="shoptext${isDone?' done':''}">${esc(g.text)}</div>
 <div class="tmeta">
 ${g.qty?`<span style="font-size:10px;color:#6b7280;background:#f5f3ef;border-radius:4px;padding:2px 6px">${esc(g.qty)}</span>`:''}
 ${tg?`<span class="tag-pill" style="background:${tg.color}22;color:${tg.color}">${esc(tg.name)}</span>`:''}
 ${g.notes?`<span style="font-size:10px;color:#9ca3af">has notes</span>`:''}
 </div>
 </div>
 <button class="ibtn" onclick="openModal('editShop',{id:${g.id},title:'${g.text.replace(/'/g,"\\'")}',qty:'${(g.qty||'').replace(/'/g,"\\'")}',notes:'${(g.notes||'').replace(/'/g,"\\'")}',tagId:${g.tagId||'null'}})">${iEdit}</button>
 </div>`;
}

// TAG MANAGER 
function renderTagMgr(){
 let h=`<div class="sectitle">Tag Manager</div><div class="secsub">Create and manage your color tags.</div>`;
 h+=`<div style="background:#ffffff;border:1px solid #e8e3dc;border-radius:13px;padding:18px;margin-bottom:20px">
 <div style="font-size:12px;color:#6b7280;text-transform:uppercase;letter-spacing:.08em;font-weight:500;margin-bottom:12px">Create a new tag</div>
 <div style="margin-bottom:10px"><div style="font-size:11px;color:#9ca3af;margin-bottom:7px">Pick a color</div>
 <div style="display:flex;flex-wrap:wrap;gap:8px">`;
 TAG_COLORS.forEach(c=>{h+=`<div class="tcolor-swatch${S.newTagColor===c?' sel':''}" style="background:${c}" onclick="S.newTagColor='${c}';render()"></div>`;});
 h+=`</div></div>
 <div style="display:flex;gap:8px">
 <input class="minput" placeholder="Tag name…" id="tagNameInp" value="${esc(S.newTagName)}" oninput="S.newTagName=this.value" onkeydown="if(event.key==='Enter')addTag()"/>
 <button class="save-btn" style="flex:0;padding:11px 18px;font-size:13px" onclick="addTag()">Add tag</button>
 </div>
 ${S.newTagName&&!S.newTagName.trim()?'<div style="font-size:12px;color:#bc0a0a;margin-top:6px">Enter a tag name.</div>':''}
 </div>`;
 if(!S.tags.length)return h+`<div class="empty"><div class="eicon">—</div><div class="etxt">No tags yet. Create your first one above.</div></div>`;
 h+=`<div style="font-size:12px;color:#6b7280;text-transform:uppercase;letter-spacing:.08em;font-weight:500;margin-bottom:10px">Your tags (${S.tags.length})</div>`;
 S.tags.forEach(t=>{h+=`<div class="tag-card">
 <div style="width:28px;height:28px;border-radius:50%;background:${t.color};flex-shrink:0"></div>
 <div style="flex:1"><div style="font-size:14px;color:#374151;font-weight:500">${esc(t.name)}</div></div>
 <button class="ibtn" onclick="if(confirm('Delete tag &quot;${esc(t.name)}&quot;?'))deleteTag(${t.id})">${iDel}</button>
 </div>`;});
 return h;
}

// AUTH 
function renderAuth(){
 const isSignup=S.authMode==='signup';
 return`<div class="center"><div class="acard">
 <div class="alogo">&#10022; Planner</div>
 <div class="atitle">${isSignup?'Create account':'Welcome back'}</div>
 <div class="asub">${isSignup?'Set up your account to get started.':'Sign in to your planner.'}</div>
 <div class="alabel">Email</div>
 <input class="ainput" type="email" placeholder="you@example.com" value="${esc(S.email)}" oninput="S.email=this.value" onkeydown="if(event.key==='Enter')doAuth()" autofocus/>
 <div class="alabel">Password</div>
 <input class="ainput" type="password" placeholder="${isSignup?'Choose a password (6+ chars)':'Your password'}" value="${esc(S.password)}" oninput="S.password=this.value" onkeydown="if(event.key==='Enter')doAuth()"/>
 <button class="abtn" onclick="doAuth()">${isSignup?'Create account →':'Sign in →'}</button>
 ${S.authErr?`<div class="aerr">${esc(S.authErr)}</div>`:''}
 <button class="atoggle" onclick="S.authMode=S.authMode==='signin'?'signup':'signin';S.authErr='';render()">${isSignup?'Already have an account? Sign in':'No account? Create one'}</button>
 </div></div>`;
}

// BOOT 
async function startApp(user){uid=user.id;S.screen='app';S.sync='syncing';render();await load(uid);render();}
async function boot(){
 const{data}=await sb.auth.getSession();
 if(data?.session?.user){await startApp(data.session.user);return;}
 S.screen='login';render();
}
sb.auth.onAuthStateChange(async(event,session)=>{if(event==='SIGNED_IN'&&session?.user&&S.screen!=='app')await startApp(session.user);if(event==='SIGNED_OUT')render();});
boot();
</script>
</body>
</html>
