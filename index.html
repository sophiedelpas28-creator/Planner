<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Planner</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0f0f10;color:#e8e6e0;font-family:'DM Sans','Segoe UI',sans-serif}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#2a2a2e;border-radius:4px}
input,button,textarea,select{font-family:inherit}button{cursor:pointer}
/* TOPBAR */
.topbar{display:flex;align-items:center;padding:0 16px;height:50px;border-bottom:1px solid #1a1a1e;background:#0f0f10;position:sticky;top:0;z-index:90;flex-shrink:0}
.star-btn{width:32px;height:32px;border-radius:8px;border:none;background:transparent;color:#e8e3d8;font-size:17px;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
.star-btn:hover{background:#1a1a1e}
.page-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;color:#e8e3d8;margin-left:10px}
.topbar-right{margin-left:auto}.sout{font-size:12px;color:#333;background:none;border:none}.sout:hover{color:#888}
/* SIDEBAR */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.open{opacity:1;pointer-events:all}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:255px;background:#111118;border-right:1px solid #1e1e28;z-index:201;transform:translateX(-100%);transition:transform .22s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.sidebar.open{transform:none}
.sidebar-head{display:flex;align-items:center;padding:15px 17px;border-bottom:1px solid #1a1a1e}
.sidebar-logo{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;color:#e8e3d8;letter-spacing:.06em}
.sidebar-close{margin-left:auto;background:none;border:none;color:#444;font-size:20px;line-height:1}.sidebar-close:hover{color:#aaa}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 0}
.snav-item{display:flex;align-items:center;gap:11px;padding:11px 17px;color:#555;font-size:14px;font-weight:500;transition:all .15s;border:none;background:none;width:100%;text-align:left;border-left:2px solid transparent}
.snav-item:hover{color:#ccc;background:#1a1a1e}.snav-item.active{color:#e8e3d8;background:#1a1a1e;border-left-color:#e8e3d8}
.snav-icon{font-size:15px;width:20px;text-align:center}
/* SHELL */
.shell{display:flex;flex-direction:column;height:100vh}.scroll{flex:1;overflow-y:auto}
.wrap{max-width:760px;margin:0 auto;padding:18px 18px 90px}
/* SYNC */
.syncbar{position:fixed;bottom:0;left:0;right:0;background:#0f0f10;border-top:1px solid #1a1a1e;padding:7px 20px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;color:#2e2e34;z-index:80}
.sdot{width:5px;height:5px;border-radius:50%;background:#2e2e34;flex-shrink:0}
.sdot.synced{background:#5a8a5a}.sdot.syncing{background:#a5843a;animation:pulse 1s infinite}.sdot.error{background:#8a4a4a}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
/* AUTH */
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 20px}
.acard{background:#15151a;border:1px solid #1e1e24;border-radius:18px;padding:36px;max-width:400px;width:100%}
.alogo{font-family:'Syne',sans-serif;font-size:12px;font-weight:800;color:#333;letter-spacing:.14em;text-transform:uppercase;margin-bottom:20px}
.atitle{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:#e8e3d8;margin-bottom:5px}
.asub{font-size:13px;color:#555;line-height:1.6;margin-bottom:20px}
.alabel{font-size:11px;color:#555;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px;font-weight:500}
.ainput{width:100%;background:#1a1a1e;border:1px solid #2a2a2e;border-radius:10px;padding:12px 13px;color:#e8e6e0;font-size:14px;outline:none;margin-bottom:11px;transition:border-color .15s}
.ainput:focus{border-color:#555}.ainput::placeholder{color:#3a3a40}
.abtn{width:100%;background:#e8e3d8;color:#0f0f10;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:600;transition:all .15s}
.abtn:hover{background:#f0ece3}.abtn:disabled{opacity:.5;cursor:not-allowed}
.atoggle{width:100%;background:transparent;border:1px solid #2a2a2e;color:#555;border-radius:10px;padding:11px;font-size:13px;transition:all .15s;margin-top:8px}
.atoggle:hover{border-color:#444;color:#999}
.aerr{font-size:13px;color:#9a5a5a;margin-top:8px;text-align:center}
/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.modal-backdrop.center-modal{align-items:center}
.modal{background:#15151a;border:1px solid #1e1e28;border-radius:18px 18px 0 0;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:22px 20px 30px;animation:slideUp .2s ease}
.modal-center{border-radius:18px;max-height:85vh}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.modal-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:#e8e3d8;margin-bottom:18px}
.modal-handle{width:36px;height:4px;background:#2a2a2e;border-radius:2px;margin:0 auto 18px}
.mfield{margin-bottom:14px}
.mfield label{display:block;font-size:11px;color:#555;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px;font-weight:500}
.minput{width:100%;background:#1a1a1e;border:1px solid #2a2a2e;border-radius:9px;padding:11px 13px;color:#e8e6e0;font-size:14px;outline:none;transition:border-color .15s}
.minput:focus{border-color:#555}.minput::placeholder{color:#3a3a40}
.mselect{width:100%;background:#1a1a1e;border:1px solid #2a2a2e;border-radius:9px;padding:10px 13px;color:#c8c5bc;font-size:13px;outline:none}
.mtextarea{width:100%;background:#1a1a1e;border:1px solid #2a2a2e;border-radius:9px;padding:11px 13px;color:#c8c5bc;font-size:13px;line-height:1.6;outline:none;resize:none;min-height:72px;transition:border-color .15s}
.mtextarea:focus{border-color:#555}.mtextarea::placeholder{color:#3a3a40}
.modal-actions{display:flex;gap:8px;margin-top:20px}
.save-btn{flex:1;background:#e8e3d8;color:#0f0f10;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:600;transition:all .15s}
.save-btn:hover{background:#f0ece3}
.cancel-btn{background:#1a1a1e;color:#666;border:1px solid #2a2a2e;border-radius:10px;padding:13px 18px;font-size:14px;transition:all .15s}
.cancel-btn:hover{border-color:#444;color:#999}
.del-btn{background:#1e1414;color:#9a5a5a;border:1px solid #3a2020;border-radius:10px;padding:13px 18px;font-size:14px;transition:all .15s}
.del-btn:hover{background:#2a1a1a}
/* SHARED */
.sectitle{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:#e8e3d8;letter-spacing:-.02em;margin-bottom:4px}
.secsub{font-size:13px;color:#444;margin-bottom:14px}
.divr{height:1px;background:#1a1a1e;margin:16px 0}
.ibtn{background:none;border:none;padding:5px;color:#2e2e34;transition:color .15s;display:flex;align-items:center;flex-shrink:0}
.ibtn:hover{color:#999}
.empty{text-align:center;padding:44px 0}
.eicon{font-size:24px;margin-bottom:8px}.etxt{font-size:14px;color:#2e2e34}
/* PRIMARY ADD BTN */
.primary-add{display:flex;align-items:center;gap:8px;background:#e8e3d8;color:#0f0f10;border:none;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:600;transition:all .15s;margin-bottom:18px}
.primary-add:hover{background:#f0ece3}
/* FAB */
.fab{position:fixed;bottom:52px;right:18px;width:52px;height:52px;border-radius:50%;background:#e8e3d8;color:#0f0f10;border:none;font-size:24px;display:flex;align-items:center;justify-content:center;z-index:70;box-shadow:0 4px 20px rgba(0,0,0,.5);transition:all .15s}
.fab:hover{background:#f0ece3;transform:scale(1.05)}
.fab-menu{position:fixed;bottom:114px;right:18px;z-index:70;display:flex;flex-direction:column;gap:8px;align-items:flex-end;animation:fadeIn .15s ease}
.fab-item{display:flex;align-items:center;gap:8px;background:#1e1e28;border:1px solid #2a2a38;border-radius:100px;padding:8px 14px;font-size:13px;color:#c8c5bc;white-space:nowrap;transition:all .15s}
.fab-item:hover{background:#2a2a38;color:#e8e3d8}
/* TAGS */
.tag-pill{display:inline-flex;align-items:center;gap:4px;border-radius:100px;padding:2px 9px;font-size:11px;font-weight:500;flex-shrink:0}
.filter-bar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filter-chip{padding:4px 11px;border-radius:100px;border:1px solid #2a2a2e;background:transparent;color:#555;font-size:12px;transition:all .15s;cursor:pointer}
.filter-chip:hover{border-color:#555;color:#ccc}
.filter-chip.on{font-weight:600}
/* SECTION NAV */
.secnav{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none;align-items:center}
.secnav::-webkit-scrollbar{display:none}
.sbtn{padding:6px 13px;border-radius:100px;border:1px solid #2a2a2e;background:transparent;color:#555;font-size:12px;transition:all .15s;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:4px}
.sbtn:hover{border-color:#444;color:#ccc;background:#1a1a1e}
.sbtn.active{background:#e8e3d8;color:#0f0f10;border-color:#e8e3d8;font-weight:500}
.badge{font-size:10px;font-weight:600;padding:1px 5px;border-radius:100px;background:#2a2a2e;color:#555}
.sbtn.active .badge{background:rgba(0,0,0,.15);color:#0f0f10}
.add-sec-btn{width:26px;height:26px;border-radius:50%;border:1px dashed #2a2a2e;background:transparent;color:#444;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.add-sec-btn:hover{border-color:#666;color:#aaa}
.new-sec-input{background:#1a1a1e;border:1px solid #444;border-radius:100px;padding:5px 11px;color:#e8e6e0;font-size:12px;outline:none;width:110px;flex-shrink:0}
/* TASK LIST */
.tasklist{border-top:1px solid #1a1a1e}
.trow{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid #1a1a1e;animation:fadeIn .18s ease}
.cbox{width:18px;height:18px;flex-shrink:0;border:1.5px solid #3a3a40;border-radius:5px;background:transparent;display:flex;align-items:center;justify-content:center;transition:all .15s}
.cbox:hover{border-color:#777}.cbox.done{background:#b5a98c;border-color:#b5a98c}
.twrap{flex:1;min-width:0}
.ttext{font-size:14px;color:#c8c5bc;line-height:1.4;word-break:break-word}
.ttext.done{text-decoration:line-through;color:#444}
.tmeta{display:flex;align-items:center;gap:5px;margin-top:3px;flex-wrap:wrap}
.tdatetag{font-size:10px;color:#555;background:#1a1a1e;border-radius:4px;padding:2px 6px}
.done-lbl{font-size:10px;letter-spacing:.1em;color:#2a2a2e;text-transform:uppercase;margin:12px 0 4px;font-weight:500}
.done-row{opacity:.4}
/* SUBTASK IN MODAL */
.sub-list{border:1px solid #1e1e28;border-radius:8px;overflow:hidden;margin-bottom:8px}
.sub-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #1a1a1e}
.sub-item:last-child{border-bottom:none}
.scbox{width:14px;height:14px;flex-shrink:0;border:1.5px solid #2a2a3a;border-radius:3px;background:transparent;display:flex;align-items:center;justify-content:center;transition:all .15s}
.scbox.done{background:#7a6a5a;border-color:#7a6a5a}
.sub-text{flex:1;font-size:13px;color:#777}.sub-text.done{text-decoration:line-through;color:#3a3a3a}
.sdel{background:none;border:none;color:#2a2a2e;padding:2px;transition:color .15s;display:flex;align-items:center}.sdel:hover{color:#888}
.sub-add-row{display:flex;gap:6px}
.sub-input{flex:1;background:#1a1a1e;border:1px solid #1e1e28;border-radius:7px;padding:7px 10px;color:#c0bdb5;font-size:13px;outline:none}
.sub-input::placeholder{color:#2a2a2e}
.sub-add-btn{background:#1e1e28;border:none;color:#777;border-radius:7px;padding:7px 11px;font-size:12px;transition:all .15s}
.sub-add-btn:hover{background:#2a2a38;color:#ccc}
/* EVENT LIST */
.ev-card{background:#13131a;border:1px solid #1e1e24;border-radius:12px;padding:13px 15px;margin-bottom:8px;display:flex;align-items:center;gap:10px;animation:fadeIn .18s ease}
.ev-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.ev-info{flex:1;min-width:0}
.ev-title{font-size:14px;color:#c8c5bc;font-weight:500}
.ev-meta{display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap;font-size:11px;color:#555}
/* CALENDAR */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calmtitle{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;color:#e8e3d8}
.calnav{background:#1a1a1e;border:1px solid #2a2a2e;color:#666;border-radius:7px;padding:5px 11px;font-size:12px;transition:all .15s}
.calnav:hover{border-color:#444;color:#ccc}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#1a1a1e;border:1px solid #1a1a1e;border-radius:11px;overflow:hidden;margin-bottom:12px}
.caldh{background:#0f0f10;padding:6px 3px;text-align:center;font-size:9px;color:#333;text-transform:uppercase;font-weight:600;letter-spacing:.06em}
.calcell{background:#0f0f10;min-height:58px;padding:4px;cursor:pointer;transition:background .1s}
.calcell:hover{background:#131318}
.calcell.om{opacity:.25}.calcell.tdy{background:#121620}.calcell.sel{background:#141a14;outline:1px solid #2a3a2a;outline-offset:-1px}
.cdn{font-size:10px;color:#3a3a40;font-weight:500;margin-bottom:2px}
.calcell.tdy .cdn{color:#7ab87a;font-weight:700}.calcell.sel .cdn{color:#e8e3d8}
.cdots{display:flex;flex-wrap:wrap;gap:2px;margin-top:1px}
.ctdot{width:5px;height:5px;border-radius:50%}
.cchip{font-size:9px;border-radius:3px;padding:1px 3px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:block}
.daypanel{background:#13131a;border:1px solid #1e1e28;border-radius:12px;padding:15px;margin-bottom:14px;animation:fadeIn .15s ease}
.dptitle{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:#e8e3d8;margin-bottom:12px}
.dpsec{font-size:10px;color:#3a3a40;letter-spacing:.1em;text-transform:uppercase;margin:10px 0 6px;font-weight:500}
.dp-add-btns{display:flex;gap:7px;margin-bottom:10px}
.dp-add-btn{flex:1;background:#1a1a1e;border:1px solid #2a2a2e;color:#777;border-radius:8px;padding:8px;font-size:12px;transition:all .15s}
.dp-add-btn:hover{border-color:#555;color:#ccc}
/* REVIEW PENDING */
.pending-task{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #1a1a1e}
.pending-task:last-child{border-bottom:none}
.pt-info{flex:1;min-width:0}
.pt-text{font-size:14px;color:#b0ada5;line-height:1.4}.pt-text.done{text-decoration:line-through;color:#444}
.pt-meta{display:flex;align-items:center;gap:5px;margin-top:3px;flex-wrap:wrap;font-size:10px;color:#555}
.pt-date.overdue{color:#9a5a5a}.pt-date.today{color:#7aaa5a}
/* HABITS */
.htop{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.ptrack{height:3px;background:#1e1e22;border-radius:2px;overflow:hidden;margin-top:5px;width:56px}
.pfill{height:100%;background:#5a8a5a;border-radius:2px;transition:width .4s ease}
.hcard{background:#13131a;border:1px solid #1e1e24;border-radius:11px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;margin-bottom:7px;animation:fadeIn .18s ease}
.hcard.ht{border-color:#243024;background:#101a10}
.htoprow{display:flex;align-items:center;gap:9px}
.htoggle{width:22px;height:22px;border-radius:50%;border:1.5px solid #3a3a40;background:transparent;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.htoggle.done{background:#5a8a5a;border-color:#5a8a5a}
.hname{flex:1;font-size:14px;color:#888;font-weight:500}.hname.done{color:#7ab87a}
.hstreak{display:flex;align-items:center;gap:3px;background:#162016;border-radius:100px;padding:2px 8px}
.hstreakn{font-size:11px;font-weight:600;color:#6aaa6a}
.hdots{display:flex;align-items:center;gap:4px}
.dcol{display:flex;flex-direction:column;align-items:center;gap:3px}
.hdot{width:8px;height:8px;border-radius:50%;border:1px solid #1e1e28;background:transparent}
.hdot.hit{background:#5a8a5a;border-color:#5a8a5a}.hdot.td{border:1.5px solid #555}
.dlbl{font-size:8px;color:#2e2e2e}
.best{margin-left:auto;font-size:10px;color:#252525}.best span{color:#4a6a3a}
/* NOTES */
.note-card{background:#13131a;border:1px solid #1e1e24;border-radius:12px;padding:15px;margin-bottom:9px;animation:fadeIn .18s ease;transition:border-color .15s}
.note-card:hover{border-color:#2a2a30}
.note-title-input{width:100%;background:transparent;border:none;outline:none;color:#e8e3d8;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;padding:0;margin-bottom:6px}
.note-title-input::placeholder{color:#2a2a30}
.note-body{width:100%;background:transparent;border:none;outline:none;color:#888;font-size:13px;line-height:1.7;resize:none;padding:0;min-height:56px}
.note-body::placeholder{color:#2a2a2e}
.note-footer{display:flex;align-items:center;gap:7px;margin-top:9px;padding-top:8px;border-top:1px solid #1a1a1e;flex-wrap:wrap}
.note-date{font-size:11px;color:#2e2e34}
.sort-items{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.sort-item{background:#1a1a1e;border-radius:8px;padding:9px 11px}
.sort-item-text{font-size:13px;color:#b0ada5;margin-bottom:7px}
.sort-btns{display:flex;flex-wrap:wrap;gap:4px}
.smove{padding:4px 10px;border-radius:100px;border:1px solid #2a2a2e;background:transparent;color:#666;font-size:11px;transition:all .15s}
.smove:hover{border-color:#888;color:#e8e3d8;background:#1e1e24}
.smove.t{border-color:#3a4a2a;color:#7aaa6a}
.sdiscard{padding:4px 10px;border-radius:100px;border:1px solid #2a2a2e;background:transparent;color:#444;font-size:11px}
.sdiscard:hover{border-color:#8a3a3a;color:#8a5a5a}
/* SHOPPING */
.shoprow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #1a1a1e}
.shoprow:last-child{border-bottom:none}
.gcheck{width:18px;height:18px;flex-shrink:0;border:1.5px solid #3a8a5a;border-radius:5px;background:transparent;display:flex;align-items:center;justify-content:center;transition:all .15s}
.gcheck:hover{border-color:#6aca8a}.gcheck.done{background:#4a7a5a;border-color:#4a7a5a}
.shopwrap{flex:1;min-width:0}
.shoptext{font-size:14px;color:#c8c5bc}.shoptext.done{text-decoration:line-through;color:#444}
/* TAG MANAGER */
.tag-card{display:flex;align-items:center;gap:10px;padding:11px 14px;background:#13131a;border:1px solid #1e1e24;border-radius:10px;margin-bottom:7px}
.tcolor-swatch{width:28px;height:28px;border-radius:50%;flex-shrink:0;cursor:pointer;border:2px solid transparent;transition:all .1s}
.tcolor-swatch:hover{transform:scale(1.1)}
.tcolor-swatch.sel{border-color:#fff}
@media(max-width:600px){
  .wrap{padding:14px 12px 90px}.topbar{padding:0 12px}
  .calcell{min-height:44px}.cchip{display:none}.acard{padding:26px 16px}.sidebar{width:82vw}
  .modal{padding:18px 16px 28px}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

// ── UTILS ──
function tkey(){return new Date().toISOString().slice(0,10)}
function dkey(y,m,d){return`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmtDate(ds){if(!ds)return'';const d=new Date(ds+'T12:00:00');return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
function relDate(ds){if(!ds)return null;const t=tkey();if(ds<t)return'overdue';if(ds===t)return'today';return null;}
function streak(id,log){let n=0,b=new Date();for(let i=0;i<365;i++){const d=new Date(b);d.setDate(d.getDate()-i);if(log[d.toISOString().slice(0,10)]?.[id])n++;else break;}return n;}
function bestStreak(id,log){let max=0,cur=0;Object.keys(log).sort().forEach(k=>{if(log[k]?.[id]){cur++;if(cur>max)max=cur;}else cur=0;});return max;}
function last7(){const o=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);o.push({key:d.toISOString().slice(0,10),lbl:i===0?'T':['S','M','T','W','T','F','S'][d.getDay()]});}return o;}
function allTasksFlat(){const o=[];Object.entries(S.tasks).forEach(([sec,list])=>{if(Array.isArray(list))list.forEach(t=>o.push({...t,sec}));});return o;}
function tasksForDay(ds){return allTasksFlat().filter(t=>t.dueDate===ds)}
function eventsForDay(ds){return(S.events||[]).filter(e=>e.date===ds)}
function getTag(id){return S.tags.find(t=>t.id==id)||null}
function allSecs(){return[...BASE_SECS,...S.customSecs]}
function tagBadge(tagId){const t=getTag(tagId);if(!t)return'';return`<span class="tag-pill" style="background:${t.color}22;color:${t.color}">${esc(t.name)}</span>`;}
function evTypeLabel(v){return EV_TYPES.find(t=>t.v===v)?.l||'📅 Event';}

// ── AUTH ──
async function doAuth(){
  const email=S.email.trim(),pass=S.password.trim();
  if(!email||!pass){S.authErr="Fill in both fields.";render();return;}
  if(S.authMode==='signup'&&pass.length<6){S.authErr="Password must be 6+ chars.";render();return;}
  S.authErr='';
  if(S.authMode==='signin'){
    const{data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error){S.authErr="Wrong email or password.";render();return;}
    if(data.user)await startApp(data.user);
  } else {
    const{data,error}=await sb.auth.signUp({email,password:pass});
    if(error){S.authErr=error.message;render();return;}
    if(data.user){if(!data.user.identities?.length){S.authErr="Email already registered. Sign in instead.";S.authMode='signin';render();return;}await startApp(data.user);}
  }
}
async function signOut(){await sb.auth.signOut();uid=null;Object.assign(S,{screen:"login",tasks:{},habits:[],habitLog:{},events:[],shopping:[],customSecs:[],tags:[],notes:[],email:"",password:"",authErr:""});render();}

// ── DATA ──
async function load(userId){
  try{
    const{data}=await sb.from('planner_data').select('*').eq('user_id',userId).single();
    if(data){
      const t=data.tasks||{};
      S.shopping=t._shopping||[];S.customSecs=t._customSecs||[];S.tags=t._tags||[];S.notes=t._notes||[];
      const{_shopping,_customSecs,_tags,_notes,...actual}=t;
      S.tasks=actual;S.habits=data.habits||[];S.habitLog=data.habit_log||{};S.events=data.events||[];
    }
    S.sync='synced';
  }catch(e){S.sync='error';}
}
async function save(){
  if(!uid)return;S.sync='syncing';render();
  try{
    const tasksToSave={...S.tasks,_shopping:S.shopping,_customSecs:S.customSecs,_tags:S.tags,_notes:S.notes};
    await sb.from('planner_data').upsert({user_id:uid,tasks:tasksToSave,habits:S.habits,habit_log:S.habitLog,events:S.events,updated_at:new Date().toISOString()},{onConflict:'user_id'});
    S.sync='synced';
  }catch(e){S.sync='error';}
  render();
}
function commit(){save();}

  if(S.modal==='editTask'){

// ── FILTER BAR ──
function filterBar(current,onClickFn){
  if(!S.tags.length)return'';
  let h=`<div class="filter-bar"><span style="font-size:11px;color:#333">Filter:</span>
    <button class="filter-chip${!current?' on':''}" onclick="${onClickFn}(null)" style="${!current?'border-color:#888;color:#ccc':''}">All</button>`;
  S.tags.forEach(t=>{const on=current==t.id;h+=`<button class="filter-chip${on?' on':''}" onclick="${onClickFn}(${t.id})" style="${on?`border-color:${t.color};color:${t.color}`:''}"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${t.color};margin-right:3px;vertical-align:middle"></span>${esc(t.name)}</button>`;});
  h+=`</div>`;return h;
}

function renderCalendar(){

        <div style="flex:1"><div style="font-size:13px;color:#b0ada5">${esc(e.title)}</div><div style="font-size:11px;color:#555">${em}${e.time?' · '+e.time:''}${tg?' · '+tg.name:''}</div></div>

  h+=filterBar(S.shopFilter,'setShopFilter');
  h+=`<button class="primary-add" onclick="openModal('addShop')">+ Add item</button>`;
  if(bought.length)h+=`<button onclick="clearBought()" style="background:transparent;border:1px solid #2a2a2e;color:#555;border-radius:8px;padding:7px 13px;font-size:12px;margin-bottom:12px;transition:all .15s" onmouseover="this.style.borderColor='#9a4a4a';this.style.color='#9a5a5a'" onmouseout="this.style.borderColor='#2a2a2e';this.style.color='#555'">Clear bought (${bought.length})</button>`;
  if(!S.shopping.length)return h+`<div class="empty"><div class="eicon">🛒</div><div class="etxt">Empty list.</div></div>`;
  fp.forEach(g=>{h+=renderShopRow(g,false);});
  if(fb.length){h+=`<div class="done-lbl">Bought</div>`;fb.forEach(g=>{h+=renderShopRow(g,true);});}
  return h;
}
function setShopFilter(id){S.shopFilter=id;render();}
function renderShopRow(g,isDone){
  const tg=getTag(g.tagId);
  return`<div class="shoprow${isDone?' done-row':''}">
    <button class="gcheck${isDone?' done':''}" onclick="toggleShop(${g.id})">${isDone?iGChk:''}</button>
    <div class="shopwrap">
      <div class="shoptext${isDone?' done':''}">${esc(g.text)}</div>
      <div class="tmeta">
        ${g.qty?`<span style="font-size:10px;color:#555;background:#1a1a1e;border-radius:4px;padding:2px 6px">${esc(g.qty)}</span>`:''}
        ${tg?`<span class="tag-pill" style="background:${tg.color}22;color:${tg.color}">${esc(tg.name)}</span>`:''}
        ${g.notes?`<span style="font-size:10px;color:#444">has notes</span>`:''}
      </div>
    </div>
    <button class="ibtn" onclick="openModal('editShop',{id:${g.id},title:'${g.text.replace(/'/g,"\\'")}',qty:'${(g.qty||'').replace(/'/g,"\\'")}',notes:'${(g.notes||'').replace(/'/g,"\\'")}',tagId:${g.tagId||'null'}})">${iEdit}</button>
  </div>`;
}

// ── TAG MANAGER ──
function renderTagMgr(){
  let h=`<div class="sectitle">Tag Manager</div><div class="secsub">Create and manage your color tags.</div>`;
  h+=`<div style="background:#13131a;border:1px solid #1e1e24;border-radius:13px;padding:18px;margin-bottom:20px">
    <div style="font-size:12px;color:#555;text-transform:uppercase;letter-spacing:.08em;font-weight:500;margin-bottom:12px">Create a new tag</div>
    <div style="margin-bottom:10px"><div style="font-size:11px;color:#444;margin-bottom:7px">Pick a color</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">`;
  TAG_COLORS.forEach(c=>{h+=`<div class="tcolor-swatch${S.newTagColor===c?' sel':''}" style="background:${c}" onclick="S.newTagColor='${c}';render()"></div>`;});
  h+=`</div></div>
    <div style="display:flex;gap:8px">
      <input class="minput" placeholder="Tag name…" id="tagNameInp" value="${esc(S.newTagName)}" oninput="S.newTagName=this.value" onkeydown="if(event.key==='Enter')addTag()"/>
      <button class="save-btn" style="flex:0;padding:11px 18px;font-size:13px" onclick="addTag()">Add tag</button>
    </div>
    ${S.newTagName&&!S.newTagName.trim()?'<div style="font-size:12px;color:#9a5a5a;margin-top:6px">Enter a tag name.</div>':''}
  </div>`;
  if(!S.tags.length)return h+`<div class="empty"><div class="eicon">🏷️</div><div class="etxt">No tags yet. Create your first one above.</div></div>`;
  h+=`<div style="font-size:12px;color:#555;text-transform:uppercase;letter-spacing:.08em;font-weight:500;margin-bottom:10px">Your tags (${S.tags.length})</div>`;
  S.tags.forEach(t=>{h+=`<div class="tag-card">
    <div style="width:28px;height:28px;border-radius:50%;background:${t.color};flex-shrink:0"></div>
    <div style="flex:1"><div style="font-size:14px;color:#c8c5bc;font-weight:500">${esc(t.name)}</div></div>
    <button class="ibtn" onclick="if(confirm('Delete tag &quot;${esc(t.name)}&quot;?'))deleteTag(${t.id})">${iDel}</button>
  </div>`;});
  return h;
}

// ── AUTH ──
function renderAuth(){
  const isSignup=S.authMode==='signup';
  return`<div class="center"><div class="acard">
    <div class="alogo">✦ Planner</div>
    <div class="atitle">${isSignup?'Create account':'Welcome back'}</div>
    <div class="asub">${isSignup?'Set up your account to get started.':'Sign in to your planner.'}</div>
    <div class="alabel">Email</div>
    <input class="ainput" type="email" placeholder="you@example.com" value="${esc(S.email)}" oninput="S.email=this.value" onkeydown="if(event.key==='Enter')doAuth()" autofocus/>
    <div class="alabel">Password</div>
    <input class="ainput" type="password" placeholder="${isSignup?'Choose a password (6+ chars)':'Your password'}" value="${esc(S.password)}" oninput="S.password=this.value" onkeydown="if(event.key==='Enter')doAuth()"/>
    <button class="abtn" onclick="doAuth()">${isSignup?'Create account →':'Sign in →'}</button>
    ${S.authErr?`<div class="aerr">${esc(S.authErr)}</div>`:''}
    <button class="atoggle" onclick="S.authMode=S.authMode==='signin'?'signup':'signin';S.authErr='';render()">${isSignup?'Already have an account? Sign in':'No account? Create one'}</button>
  </div></div>`;
}

// ── BOOT ──
async function startApp(user){uid=user.id;S.screen='app';S.sync='syncing';render();await load(uid);render();}
async function boot(){
  const{data}=await sb.auth.getSession();
  if(data?.session?.user){await startApp(data.session.user);return;}
  S.screen='login';render();
}
sb.auth.onAuthStateChange(async(event,session)=>{if(event==='SIGNED_IN'&&session?.user&&S.screen!=='app')await startApp(session.user);if(event==='SIGNED_OUT')render();});
boot();
</script>
</body>
</html>
